[package]
name = "anterm-app"
version.workspace = true
edition.workspace = true
description = "Thin desktop application shell for anterm: startup, multi-window orchestration, tab/split workspace, command palette, and tray"
repository.workspace = true
license.workspace = true
readme = "../../README.md"
publish = false

[[bin]]
name = "anterm-app"
path = "src/main.rs"

[dependencies]
# Headless core & domain crates.
anterm-core = { path = "../anterm-core", features = ["gssapi", "remote-install", "history-db"] }
anterm-i18n = { path = "../anterm-i18n" }
anterm-protocol = { path = "../anterm-protocol" }

# Modular UI feature crates (strictly acyclic DAG compiled independently).
anterm-editor-ui = { path = "../anterm-editor-ui" }
anterm-files-ui = { path = "../anterm-files-ui" }
anterm-remote-ui = { path = "../anterm-remote-ui" }
anterm-settings-ui = { path = "../anterm-settings-ui" }
anterm-terminal = { path = "../anterm-terminal" }
anterm-ui-kit = { path = "../anterm-ui-kit" }

gpui-kit.workspace = true

anyhow.workspace = true
log.workspace = true
unicode-segmentation = "1"
smol.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
image = "0.25"
notify = "8"
resvg = { version = "0.47", default-features = false }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = "0.24"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSString"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }

[dev-dependencies]
anterm-settings-ui = { path = "../anterm-settings-ui", features = ["test-support"] }
anterm-terminal = { path = "../anterm-terminal", features = ["test-support"] }
anterm-ui-kit = { path = "../anterm-ui-kit", features = ["test-support"] }
gpui-kit = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
