[package]
name = "anterm-remote-ui"
version.workspace = true
edition.workspace = true
description = "Remote SSH UI panels for anterm: port forwards, SFTP browser & host adapter, and SSH auth prompt modal"
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
anterm-core = { path = "../anterm-core", features = ["gssapi", "remote-install", "history-db"] }
anterm-i18n = { path = "../anterm-i18n" }
anterm-protocol = { path = "../anterm-protocol" }
anterm-ui-kit = { path = "../anterm-ui-kit" }

gpui-kit.workspace = true
anyhow.workspace = true
log.workspace = true
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
anterm-ui-kit = { path = "../anterm-ui-kit", features = ["test-support"] }
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
