[package]
name = "anterm-editor-ui"
version.workspace = true
edition.workspace = true
description = "Built-in code editor workspace, split groups, Helix/LSP integration, and document column for anterm"
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
anterm-core = { path = "../anterm-core", features = ["gssapi", "remote-install", "history-db"] }
anterm-editor = { path = "../anterm-editor" }
anterm-files-ui = { path = "../anterm-files-ui" }
anterm-i18n = { path = "../anterm-i18n" }
anterm-protocol = { path = "../anterm-protocol" }
anterm-ui-kit = { path = "../anterm-ui-kit" }

gpui-kit.workspace = true
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
smol.workspace = true
lsp-types = { version = "0.97.0", features = ["proposed"] }
encoding_rs = "0.8.35"
url = "2"
percent-encoding = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[dev-dependencies]
anterm-ui-kit = { path = "../anterm-ui-kit", features = ["test-support"] }
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
