[package]
name = "anterm-settings-ui"
version.workspace = true
edition.workspace = true
description = "Autonomous GPUI Settings window and configuration pages for anterm"
repository.workspace = true
license.workspace = true
publish = false

[features]
default = []
test-support = []

[dependencies]
anterm-core = { path = "../anterm-core", features = ["gssapi", "remote-install", "history-db"] }
anterm-gateway = { path = "../anterm-gateway" }
anterm-i18n = { path = "../anterm-i18n" }
anterm-protocol = { path = "../anterm-protocol" }
anterm-ui-kit = { path = "../anterm-ui-kit" }

gpui-kit.workspace = true
anyhow.workspace = true
log.workspace = true
serde_json.workspace = true
smol.workspace = true
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
anterm-ui-kit = { path = "../anterm-ui-kit", features = ["test-support"] }
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
