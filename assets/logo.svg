<svg width="120" height="120" viewBox="170 140 684 724" xmlns="http://www.w3.org/2000/svg">
  <!-- Standalone transparent anterm (ant + terminal) emblem — same geometry as
       app-icon.svg, without the Big Sur outer tile. Legible on both light and
       dark surfaces. -->
  <defs>
    <linearGradient id="visor-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#222734"/>
      <stop offset="100%" stop-color="#13161E"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#52EE9F"/>
      <stop offset="100%" stop-color="#27C478"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFC55C"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <g>
    <!-- Swept curved ant antennae -->
    <path d="M 416 348 C 398 286 382 246 346 226 C 314 208 278 214 250 230"
          fill="none" stroke="url(#mint)" stroke-width="34" stroke-linecap="round"/>
    <path d="M 608 348 C 626 286 642 246 678 226 C 710 208 746 214 774 230"
          fill="none" stroke="url(#mint)" stroke-width="34" stroke-linecap="round"/>

    <!-- Curved geometric mandibles -->
    <path d="M 382 722 C 392 778 428 806 468 796 C 452 776 446 756 446 730 Z"
          fill="#171B24"/>
    <path d="M 642 722 C 632 778 596 806 556 796 C 572 776 578 756 578 730 Z"
          fill="#171B24"/>

    <!-- Geometric ant-head terminal frame -->
    <path d="M 326 348
             L 698 348
             C 752 348 784 384 778 438
             L 756 644
             C 750 704 704 744 644 744
             L 380 744
             C 320 744 274 704 268 644
             L 246 438
             C 240 384 272 348 326 348 Z"
          fill="url(#visor-bg)" stroke="#3FDD8C" stroke-opacity="0.35" stroke-width="18" stroke-linejoin="round"/>

    <!-- Terminal prompt ">_" -->
    <path d="M 375 468 L 483 548 L 375 628"
          fill="none" stroke="url(#mint)" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="529" y="598" width="144" height="46" rx="23" fill="url(#amber)"/>
  </g>
</svg>
