name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (arm64)
            os: macos-latest
            run_full_tests: true
          - name: Linux (x86_64)
            os: ubuntu-latest
            run_full_tests: false
          - name: Windows (x64)
            os: windows-latest
            run_full_tests: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libfontconfig1-dev libfreetype6-dev \
            libvulkan-dev libasound2-dev libssl-dev

      - name: Workspace check (all targets & tests)
        run: cargo check --workspace --all-targets --tests

      - name: Clippy unwrap_used gate
        run: cargo clippy --workspace --all-targets -- -A clippy::all -D clippy::unwrap_used

      - name: Verify headless binaries remain GUI-free
        shell: bash
        run: |
          if cargo tree -p anterm-server | grep -Eq 'gpui|rusqlite|keyring'; then
            echo "ERROR: anterm-server pulled forbidden GUI/SQLite/keyring dependencies"
            exit 1
          fi
          if cargo tree -p anterm-updater | grep -Eq 'gpui|rusqlite|keyring'; then
            echo "ERROR: anterm-updater pulled forbidden GUI/SQLite/keyring dependencies"
            exit 1
          fi

      - name: Test headless crates
        run: cargo test -p anterm-protocol -p anterm-i18n -p anterm-editor -p anterm-core --lib

      - name: Test full workspace
        if: matrix.run_full_tests
        run: cargo test --workspace --lib
