name: Anterm
options:
  bundleIdPrefix: dev.anterm
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"

targets:
  Anterm:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Anterm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.anterm.mobile
        PRODUCT_NAME: Anterm
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": "x86_64"
        OTHER_LDFLAGS: "$(inherited) -lc++ -lresolv"
    info:
      path: Anterm/Info.plist
      properties:
        CFBundleDisplayName: Anterm
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: "Scan pairing QR codes shown in Anterm Desktop or anterm-server."
        NSLocalNetworkUsageDescription: "Connect directly to your paired Anterm desktop over LAN with low latency."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - framework: Frameworks/AntermMobileFFI.xcframework
        embed: false
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: AVFoundation.framework
      - sdk: WebKit.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
